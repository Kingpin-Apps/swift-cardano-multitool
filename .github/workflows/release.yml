name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  # Gate publishing on a green build + test of the exact tagged commit. The
  # Swift workflow only runs on branch/PR pushes, not tags, so we re-run the
  # suite here rather than assuming `main` was green when the tag was cut.
  # It runs alongside the builds; only the publish job waits for it.
  test:
    name: Build & test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Cache key
        id: key
        run: |
          swift --version
          TOOLCHAIN=$(swift --version 2>&1 | shasum -a 256 | cut -c1-16)
          echo "prefix=swiftpm-macos-debug-${TOOLCHAIN}-" >> "$GITHUB_OUTPUT"
      # Saved by the Swift workflow on pushes to main.
      - name: Restore build cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: ${{ steps.key.outputs.prefix }}${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ steps.key.outputs.prefix }}
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v --parallel

  # Per-arch macOS binaries and packaged Linux binaries, all in parallel.
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}

  macos:
    name: macOS universal binary
    needs: build
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import Developer ID cert into temporary keychain
        env:
          CODESIGN_P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$CODESIGN_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CODESIGN_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')
          rm -f "$CERT_PATH"

      - uses: extractions/setup-just@v4

      - uses: actions/download-artifact@v8
        with:
          pattern: scm-macos-*
          path: bin

      - name: Combine into universal binary
        run: |
          set -euo pipefail
          just lipo-universal bin/scm-macos-arm64/scm bin/scm-macos-x86_64/scm
          chmod +x .build/universal/release/scm

      - name: Codesign
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: just sign-only

      - name: Notarize
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          BIN_PATH=".build/universal/release"
          STAGING=$(mktemp -d)
          cp "$BIN_PATH/scm" "$STAGING/"
          ZIPFILE=$(mktemp /tmp/scm-notarize-XXXXXX.zip)
          ditto -c -k --keepParent "$STAGING" "$ZIPFILE"
          xcrun notarytool submit "$ZIPFILE" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait
          rm -f "$ZIPFILE"
          rm -rf "$STAGING"

      - name: Tarball
        run: |
          set -euo pipefail
          BIN_PATH=".build/universal/release"
          "$BIN_PATH/scm" --version
          mkdir -p dist
          tar -czf "dist/scm-${GITHUB_REF_NAME}-macos-universal.tar.gz" -C "$BIN_PATH" scm

      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: dist/
          if-no-files-found: error

  # The universal binary is built on Apple Silicon, so actually run the x86_64
  # slice on an Intel runner before publishing it.
  macos-intel:
    name: Verify on Intel Mac
    needs: macos
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-macos
          path: dist
      - name: Run x86_64 slice
        run: |
          set -euo pipefail
          tar -xzf dist/scm-*-macos-universal.tar.gz
          uname -m
          arch -x86_64 ./scm --version

  publish:
    name: Publish
    needs: [test, build, macos-intel]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums + release notes
        id: package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          awk -v v="^## ${VERSION//./\\.}" '$0 ~ v {flag=1; print; next} /^## /{flag=0} flag' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "No CHANGELOG entry for $VERSION" >&2
            exit 1
          fi
          echo "notes=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"

      - name: Check publishing secrets
        env:
          APT_REPO_TOKEN: ${{ secrets.APT_REPO_TOKEN }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        # Fail before anything is published rather than halfway through.
        run: |
          if [ -z "${APT_REPO_TOKEN:-}" ] || [ -z "${APT_GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::APT_REPO_TOKEN and APT_GPG_PRIVATE_KEY secrets are required to update Kingpin-Apps/apt." >&2
            exit 1
          fi
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN secret is not set; cannot update Kingpin-Apps/homebrew-tap." >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "${{ steps.package.outputs.notes }}" \
            dist/*

      - uses: actions/checkout@v7
        with:
          repository: Kingpin-Apps/apt
          token: ${{ secrets.APT_REPO_TOKEN }}
          path: apt-repo

      - name: Update APT repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq apt-utils
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          just apt-publish apt-repo
          # Published as a single orphan commit: the pool holds ~100MB of .debs
          # per release, which would bloat the repo if kept in history.
          cd apt-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan publish
          git add -A
          git commit -q -m "swift-cardano-multitool ${GITHUB_REF_NAME}"
          git push --force origin publish:main

      - name: Bump Homebrew tap formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN secret is not set; cannot update Kingpin-Apps/homebrew-tap." >&2
            echo "Create a fine-grained PAT with Contents: read/write on the tap repo and add it as the HOMEBREW_TAP_TOKEN secret." >&2
            exit 1
          fi
          just tap-bump "$GITHUB_REF_NAME" "dist/scm-${GITHUB_REF_NAME}-macos-universal.tar.gz"
